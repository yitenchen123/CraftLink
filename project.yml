name: CraftLink
options:
  bundleIdPrefix: com.craftlink
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_BITCODE: NO
targets:
  CraftLink:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "NetworkExtension"
          - "Core"
          - "RustLib"
          - ".github"
          - "CraftLink.xcodeproj"
          - "*.md"
          - "*.yml"
          - ".*"
          - "project.yml"
          - "LICENSE"
          - "README.md"
        includes:
          - "App/**/*.swift"
          - "Views/**/*.swift"
          - "Services/**/*.swift"
          - "Models/**/*.swift"
          - "Utils/**/*.swift"
          - "ViewModels/**/*.swift"
          - "Info.plist"
          - "CraftLink.entitlements"
    entitlements:
      path: CraftLink.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: CraftLink
        CFBundleDisplayName: 陶瓦联机
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.app
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustLib
        OTHER_LDFLAGS: -all_load -leasytier_ios
    dependencies:
      - target: NetworkExtension
  NetworkExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NetworkExtension
      - path: Services/InviteCodeService.swift
      - path: Services/RustBridge.swift
    entitlements:
      path: NetworkExtension/NetworkExtension.entitlements
    info:
      path: NetworkExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.network-extension
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustLib
        OTHER_LDFLAGS: -all_load -leasytier_ios
        # ★★★ 关键：强制链接 NetworkExtension 框架 ★★★
        OTHER_LDFLAGS: -all_load -leasytier_ios -framework NetworkExtension
        # 或者使用 FRAMEWORK_SEARCH_PATHS 和 LD_FLAGS
        FRAMEWORK_SEARCH_PATHS: $(SDKROOT)/System/Library/Frameworks
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
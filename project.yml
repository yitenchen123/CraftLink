name: CraftLink
options:
  bundleIdPrefix: com.craftlink
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_BITCODE: NO
targets:
  CraftLink:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Views
      - path: Services
      - path: Models
      - path: Utils
      - path: ViewModels
      - path: Info.plist
      - path: CraftLink.entitlements
    entitlements:
      path: CraftLink.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: CraftLink
        CFBundleDisplayName: 陶瓦联机
        CFBundleExecutable: $(EXECUTABLE_NAME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.app
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Services/InviteCodeService.swift
      - path: Services/RustBridge.swift
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.packet-tunnel
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustLib
        OTHER_LDFLAGS: -all_load -leasytier_ios -framework NetworkExtension
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
name: CraftLink
options:
  bundleIdPrefix: com.craftlink
  deploymentTarget:
    iOS: 15.0
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    ENABLE_BITCODE: NO
targets:
  CraftLink:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "PacketTunnel"
          - "Core"
          - "RustLib"
          - ".github"
          - "CraftLink.xcodeproj"
          - "*.md"
          - "*.yml"
          - ".*"
          - "project.yml"
          - "LICENSE"
          - "README.md"
        includes:
          - "App/**/*.swift"
          - "Views/**/*.swift"
          - "Services/**/*.swift"
          - "Models/**/*.swift"
          - "Utils/**/*.swift"
          - "ViewModels/**/*.swift"
          - "Info.plist"
          - "CraftLink.entitlements"
    entitlements:
      path: CraftLink.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: CraftLink
        CFBundleDisplayName: 陶瓦联机
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.app
        # ★★★ 移除静态库链接，主 App 不需要 ★★★
        # LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustLib
        # OTHER_LDFLAGS: -all_load -leasytier_ios
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Services/InviteCodeService.swift
      - path: Services/RustBridge.swift
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftlink.packet-tunnel
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/RustLib
        OTHER_LDFLAGS: -all_load -leasytier_ios -framework NetworkExtension
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
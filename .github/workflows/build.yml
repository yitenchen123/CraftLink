name: Build CraftLink IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Download libeasytier_ios.a from EasyTier-iOS release
        run: |
          mkdir -p RustLib
          curl -L -o RustLib/libeasytier_ios.a "https://github.com/yitenchen123/EasyTier-iOS/releases/download/发布easytier-ios的静态库文件/libeasytier_ios.a"
          ls -la RustLib/

      - name: Check static library architecture and dependencies
        run: |
          echo "Library info:"
          file RustLib/libeasytier_ios.a
          echo "\nUndefined symbols:"
          nm -m -u RustLib/libeasytier_ios.a 2>/dev/null | grep "undefined" | awk '{print $NF}' | sort -u | head -30 || echo "None"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Build unsigned .app with detailed logging
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData \
            -showBuildTimingSummary \
            2>&1 | tee build.log
          
          # 检查是否有链接错误
          if grep -q "error:.*linker command failed" build.log; then
            echo "❌ Linker error detected!"
            grep -B5 -A10 "error:.*linker" build.log
            exit 1
          fi
          
          # 检查是否有 "Undefined symbols" 错误
          if grep -q "Undefined symbols" build.log; then
            echo "❌ Undefined symbols found!"
            grep -B5 -A15 "Undefined symbols" build.log
            exit 1
          fi

      - name: Verify app bundle contains executable
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App bundle path: $APP_PATH"
          ls -la "$APP_PATH"
          if [ ! -f "$APP_PATH/CraftLink" ]; then
            echo "❌ ERROR: Executable 'CraftLink' not found in app bundle!"
            echo "Checking build log for errors..."
            grep -E "error:|warning:" build.log | head -50
            exit 1
          fi
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "CFBundleExecutable = $EXEC_NAME"
          if [ "$EXEC_NAME" != "CraftLink" ]; then
            echo "❌ ERROR: CFBundleExecutable is '$EXEC_NAME', expected 'CraftLink'"
            exit 1
          fi
          echo "✅ App bundle is valid."

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa
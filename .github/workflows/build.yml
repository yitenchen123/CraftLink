name: Build CraftLink IPA (unsigned)

# CraftLink IPA 构建（使用预编译的 libterracotta.a）
#
# libterracotta.a 已预编译并提交到 RustLib/ 目录，CI 直接使用，无需编译 Rust。
# 因此默认 push 只跑 build-ipa job（约 3-5 分钟产出 IPA），不再跑 10 分钟的 Rust 编译。
#
# 当 Terracotta/EasyTier 上游更新或 iOS 补丁变更时，需手动触发
# rebuild-lib.yml workflow 重新编译 libterracotta.a，下载 artifact 后替换
# RustLib/libterracotta.a 并提交。
#
# 触发方式：
#   - push 到 main：自动构建 IPA
#   - 推 v* tag：构建 IPA 并发布到 Release
#   - workflow_dispatch：手动触发

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build CraftLink IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Verify prebuilt libterracotta.a
        run: |
          echo "=== 检查预编译的 libterracotta.a ==="
          if [[ ! -f RustLib/libterracotta.a ]]; then
            echo "❌ RustLib/libterracotta.a 不存在！"
            echo "请手动触发 'Rebuild libterracotta.a' workflow 重新编译，"
            echo "下载 artifact 后将 libterracotta.a 放入 RustLib/ 并提交。"
            exit 1
          fi
          ls -la RustLib/libterracotta.a
          file RustLib/libterracotta.a
          lipo -info RustLib/libterracotta.a || true
          echo "✅ 预编译 libterracotta.a 存在，跳过 Rust 编译。"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Ensure entitlements contain multicast permission
        run: |
          # 房主侧 Terracotta 的 MinecraftScanner 需要 join 多播组 224.0.2.60:4445
          # 以接收 Minecraft「对局域网开放」LAN 广播。iOS 15+ 上没有
          # com.apple.developer.networking.multicast entitlement 时
          # setsockopt(IP_ADD_MEMBERSHIP) 会失败（EPERM），导致永远检测不到
          # MC 端口（host-scanning 卡住）。
          #
          # 这里强制写回完整的 entitlements（含 multicast），确保 ldid 签名步骤
          # 能把它嵌入二进制。TrollStore 安装时通过 CoreTrust bypass honor 该权限。
          python3 - <<'PYEOF'
          ent_content = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.networking.multicast</key>
              <true/>
          </dict>
          </plist>
          '''
          with open('CraftLink.entitlements', 'w') as f:
              f.write(ent_content)
          print("=== CraftLink.entitlements ===")
          print(ent_content)
          PYEOF

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Ad-hoc sign binary with entitlements (TrollStore 兼容)
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"

          # 规范化 entitlements 文件
          plutil -convert xml1 CraftLink.entitlements
          plutil -lint CraftLink.entitlements

          # 复制 entitlements 到包内
          cp CraftLink.entitlements "$APP_PATH/"

          # CODE_SIGNING_ALLOWED=NO 下二进制无签名段，先 ad-hoc fakesign 再嵌权限
          echo "Step 1: ad-hoc fakesign binary..."
          ldid -S "$APP_PATH/CraftLink"

          echo "Step 2: embed entitlements into signed binary..."
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"

          echo "✅ Entitlements embedded. Verifying..."
          ldid -e "$APP_PATH/CraftLink" || echo "(empty entitlements — expected for non-NE app)"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa

name: Build CraftLink IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Download static library
        run: |
          mkdir -p RustLib
          curl -L -o RustLib/libeasytier_ios.a "https://github.com/yitenchen123/CraftLink/releases/download/v1.0.0-lib/libeasytier_ios.a"
          ls -la RustLib/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Embed entitlements into binaries
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"
          APPEX_PATH="$APP_PATH/PlugIns/PacketTunnel.appex"
          if [ ! -d "$APPEX_PATH" ]; then
            echo "❌ ERROR: PacketTunnel.appex not found at $APPEX_PATH"
            find "$APP_PATH" -maxdepth 3 -type d
            exit 1
          fi

          # 用 plutil 规范化 entitlements 文件，去除 BOM/CR LF/注释等潜在解析问题
          plutil -convert xml1 CraftLink.entitlements
          plutil -convert xml1 PacketTunnel/PacketTunnel.entitlements
          echo "=== CraftLink.entitlements (normalized) ==="
          cat CraftLink.entitlements
          echo "=== PacketTunnel.entitlements (normalized) ==="
          cat PacketTunnel/PacketTunnel.entitlements
          # 校验 plist 合法
          plutil -lint CraftLink.entitlements
          plutil -lint PacketTunnel/PacketTunnel.entitlements

          # 复制 entitlements 文件到对应包内
          cp CraftLink.entitlements "$APP_PATH/"
          cp PacketTunnel/PacketTunnel.entitlements "$APPEX_PATH/"

          # CODE_SIGNING_ALLOWED=NO 下二进制没有签名段，先 ad-hoc fakesign 再嵌权限
          echo "Step 1: ad-hoc fakesign both binaries..."
          ldid -S "$APP_PATH/CraftLink"
          ldid -S "$APPEX_PATH/PacketTunnel"

          echo "Step 2: embed entitlements into signed binaries..."
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"
          ldid -S"$APPEX_PATH/PacketTunnel.entitlements" "$APPEX_PATH/PacketTunnel"

          echo "✅ Entitlements embedded. Verifying..."
          echo "--- CraftLink entitlements ---"
          ldid -e "$APP_PATH/CraftLink"
          echo "--- PacketTunnel entitlements ---"
          ldid -e "$APPEX_PATH/PacketTunnel"

          # 强制校验：如果 entitlements 输出为空，构建失败
          CRAFT_ENT=$(ldid -e "$APP_PATH/CraftLink" | grep -c "networkextension" || true)
          TUNNEL_ENT=$(ldid -e "$APPEX_PATH/PacketTunnel" | grep -c "networkextension" || true)
          echo "CraftLink networkextension count: $CRAFT_ENT"
          echo "PacketTunnel networkextension count: $TUNNEL_ENT"
          if [ "$CRAFT_ENT" -eq 0 ] || [ "$TUNNEL_ENT" -eq 0 ]; then
            echo "❌ FATAL: entitlements not embedded in binary! ldid -e output empty."
            exit 1
          fi
          echo "✅ Verified: networkextension entitlement present in both binaries."

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa
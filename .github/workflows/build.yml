name: Build CraftLink IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Download static library
        run: |
          mkdir -p RustLib
          curl -L -o RustLib/libeasytier_ios.a "https://github.com/yitenchen123/CraftLink/releases/download/v1.0.0-lib/libeasytier_ios.a"
          ls -la RustLib/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Debug: List generated sources
        run: |
          grep -o "PBXBuildFile.*\.swift" CraftLink.xcodeproj/project.pbxproj | head -20

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Verify executable
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          ls -la "$APP_PATH" || exit 1
          [ -f "$APP_PATH/CraftLink" ] && echo "✅ Executable found" || (echo "❌ Executable missing"; exit 1)

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa
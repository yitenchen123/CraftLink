name: Build CraftLink IPA (unsigned)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Download static library
        run: |
          mkdir -p RustLib
          curl -L -o RustLib/libeasytier_ios.a "https://github.com/yitenchen123/CraftLink/releases/download/v1.0.0-lib/libeasytier_ios.a"
          ls -la RustLib/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Embed entitlements into binaries
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"
          # 校验 PacketTunnel.appex 已被 embed 进主 App
          APPEX_PATH="$APP_PATH/PlugIns/PacketTunnel.appex"
          if [ ! -d "$APPEX_PATH" ]; then
            echo "❌ ERROR: PacketTunnel.appex not found at $APPEX_PATH"
            echo "Bundle contents:"
            find "$APP_PATH" -maxdepth 3 -type d
            exit 1
          fi
          # 复制 entitlements 文件到对应包内
          cp CraftLink.entitlements "$APP_PATH/"
          cp PacketTunnel/PacketTunnel.entitlements "$APPEX_PATH/"
          # 用 ldid 将权限写入二进制文件（TrollStore/越狱环境靠 ldid 嵌入 entitlements）
          # 关键：必须包含 com.apple.developer.networking.networkextension=packet-tunnel-provider
          # 否则 NEPacketTunnelProvider 启动会被系统拒绝，报 permission denied
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"
          ldid -S"$APPEX_PATH/PacketTunnel.entitlements" "$APPEX_PATH/PacketTunnel"
          echo "✅ Entitlements embedded."
          # 验证 entitlements 已写入
          echo "--- CraftLink entitlements ---"
          ldid -e "$APP_PATH/CraftLink"
          echo "--- PacketTunnel entitlements ---"
          ldid -e "$APPEX_PATH/PacketTunnel"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa
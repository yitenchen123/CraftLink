name: Build CraftLink IPA (unsigned)

# 新版 CraftLink 单 target，无 PacketTunnel 扩展，无 NE 权限。
# 链接 libterracotta.a（burningtnt/Terracotta 的 iOS 构建，含 lib_ios.rs 补丁）。
#
# 触发方式：
#   - push 到 main：自动构建 IPA（含编译 libterracotta.a）
#   - 推 v* tag：构建 IPA 并发布到 Release
#   - workflow_dispatch：手动触发
#
# 修复历史问题：旧版只在 push tag 时触发，改代码后 push 不会触发构建。
# 现在加了 branches: [main]，改代码提交即触发。
#
# 全自动化：CI 自动 clone Terracotta + EasyTier、打补丁、编译 libterracotta.a，
# 再编译 IPA。无需手动准备 libterracotta.a。

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---- Job 1: 编译 libterracotta.a ----
  build-lib:
    name: Build libterracotta.a
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout CraftLink（拿补丁脚本和 lib_ios.rs）
        uses: actions/checkout@v4

      - name: Install Rust nightly + iOS targets
        run: |
          # Terracotta 用 edition = "2024"，需要 nightly
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          rustup target add aarch64-apple-ios --toolchain nightly
          # 模拟器 slice（可选，用于在 Simulator 里跑 CraftLink）
          rustup target add aarch64-apple-ios-sim --toolchain nightly
          rustup default nightly
          rustc --version
          cargo --version

      - name: Install protobuf (EasyTier build script 需要 protoc)
        run: |
          brew install protobuf
          protoc --version

      - name: Clone burningtnt/Terracotta
        run: |
          git clone https://github.com/burningtnt/Terracotta.git ../Terracotta
          cd ../Terracotta
          git log --oneline -1

      - name: Clone burningtnt/EasyTier (fork)
        run: |
          git clone -b main https://github.com/burningtnt/EasyTier.git ../EasyTier
          cd ../EasyTier
          git log --oneline -1

      - name: Apply iOS patches
        run: |
          python3 scripts/patch_terracotta_for_ios.py ../Terracotta ../EasyTier
          echo "=== 验证补丁 ==="
          grep 'cfg(any(target_os = "android", target_os = "ios"))' ../Terracotta/src/lib.rs
          grep 'target_os = "ios"' ../Terracotta/src/easytier/mod.rs
          grep 'staticlib' ../Terracotta/Cargo.toml
          grep 'target_os = "ios"' ../EasyTier/easytier/src/common/network.rs
          ls ../Terracotta/src/lib_ios.rs

      - name: Point easytier dep to local clone
        run: |
          # cargo 默认会从 git 重新拉 EasyTier，覆盖我们的补丁。
          # 用 [patch] 段把 easytier git 依赖重定向到本地已打补丁的 clone。
          # 注意：EasyTier 仓库根 Cargo.toml 是 virtual workspace（无 [package]），
          # 真正的 easytier crate 在 easytier/ 子目录，所以 path 要指到那里。
          cat >> ../Terracotta/Cargo.toml <<'EOF'

          [patch."https://github.com/burningtnt/EasyTier.git"]
          easytier = { path = "../EasyTier/easytier" }
          EOF
          echo "=== Cargo.toml 末尾 ==="
          tail -5 ../Terracotta/Cargo.toml

      - name: Build libterracotta.a (device, aarch64-apple-ios)
        run: |
          cd ../Terracotta
          cargo +nightly build --lib --release --target aarch64-apple-ios
          ls -la target/aarch64-apple-ios/release/libterracotta.a

      - name: Build libterracotta.a (simulator, aarch64-apple-ios-sim)
        continue-on-error: true
        run: |
          cd ../Terracotta
          cargo +nightly build --lib --release --target aarch64-apple-ios-sim
          ls -la target/aarch64-apple-ios-sim/release/libterracotta.a || echo "(simulator build failed — device slice is enough for TrollStore)"

      - name: Stage artifact
        run: |
          mkdir -p libterracotta-out
          cp ../Terracotta/target/aarch64-apple-ios/release/libterracotta.a libterracotta-out/libterracotta.a
          # 同时保存 simulator slice（如果构建成功）
          if [[ -f ../Terracotta/target/aarch64-apple-ios-sim/release/libterracotta.a ]]; then
            cp ../Terracotta/target/aarch64-apple-ios-sim/release/libterracotta.a libterracotta-out/libterracotta-sim.a
          fi
          ls -la libterracotta-out/

      - name: Upload libterracotta.a as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libterracotta
          path: libterracotta-out/
          retention-days: 7

  # ---- Job 2: 编译 CraftLink IPA ----
  build-ipa:
    name: Build CraftLink IPA
    needs: build-lib
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Download libterracotta.a (from build-lib job)
        uses: actions/download-artifact@v4
        with:
          name: libterracotta
          path: RustLib/

      - name: Verify libterracotta.a
        run: |
          ls -la RustLib/
          file RustLib/libterracotta.a
          # 确认是 arm64 iOS 静态库
          lipo -info RustLib/libterracotta.a || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Normalize entitlements (xcodegen 会重写 .entitlements 文件)
        run: |
          # xcodegen generate 会把 .entitlements 重写成空 <dict/>，
          # 在 TrollStore 安装时可能导致权限问题。这里用 python 写回正确内容。
          # 新版 CraftLink 不需要 NE 权限，entitlements 几乎为空。
          python3 - <<'PYEOF'
          ent_content = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          '''
          ent_lines = [line.strip() if line.strip() else line for line in ent_content.split('\n')]
          ent_cleaned = '\n'.join(ent_lines) + '\n'
          with open('CraftLink.entitlements', 'w') as f:
              f.write(ent_cleaned)
          print("=== CraftLink.entitlements ===")
          print(ent_cleaned)
          PYEOF

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Ad-hoc sign binary with entitlements (TrollStore 兼容)
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"

          # 规范化 entitlements 文件
          plutil -convert xml1 CraftLink.entitlements
          plutil -lint CraftLink.entitlements

          # 复制 entitlements 到包内
          cp CraftLink.entitlements "$APP_PATH/"

          # CODE_SIGNING_ALLOWED=NO 下二进制无签名段，先 ad-hoc fakesign 再嵌权限
          echo "Step 1: ad-hoc fakesign binary..."
          ldid -S "$APP_PATH/CraftLink"

          echo "Step 2: embed entitlements into signed binary..."
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"

          echo "✅ Entitlements embedded. Verifying..."
          ldid -e "$APP_PATH/CraftLink" || echo "(empty entitlements — expected for non-NE app)"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa

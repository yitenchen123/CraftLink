name: Build CraftLink IPA (unsigned)

# 新版 CraftLink 单 target，无 PacketTunnel 扩展，无 NE 权限。
# 只需链接 libterracotta.a（burningtnt/Terracotta 的 iOS 构建，含 lib_ios.rs 补丁）。
#
# 用户首次构建前需自行编译 libterracotta.a 并上传到 Release，然后修改下面的 URL。
# 构建方法见 README.md / scripts/build_ios.sh（在 Amethyst-Terracotta-iOS 仓库里）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen and ldid
        run: |
          brew install xcodegen
          brew install ldid

      - name: Download Terracotta static library
        run: |
          mkdir -p RustLib
          # 占位 URL — 用户构建 libterracotta.a 后上传到自己的 Release 并替换此 URL。
          # 构建步骤见 README.md「构建 libterracotta.a」一节。
          curl -L --fail -o RustLib/libterracotta.a \
            "https://github.com/yitenchen123/CraftLink/releases/download/v2.0.0-lib/libterracotta.a" \
            || {
              echo "❌ libterracotta.a 下载失败。"
              echo "请先按 README.md 步骤编译 libterracotta.a 并上传到 Release，"
              echo "然后修改 .github/workflows/build.yml 中的 URL。"
              exit 1
            }
          ls -la RustLib/

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Normalize entitlements (xcodegen 会重写 .entitlements 文件)
        run: |
          # xcodegen generate 会把 .entitlements 重写成空 <dict/>，
          # 在 TrollStore 安装时可能导致权限问题。这里用 python 写回正确内容。
          # 新版 CraftLink 不需要 NE 权限，entitlements 几乎为空。
          python3 - <<'PYEOF'
          ent_content = '''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          '''
          ent_lines = [line.strip() if line.strip() else line for line in ent_content.split('\n')]
          ent_cleaned = '\n'.join(ent_lines) + '\n'
          with open('CraftLink.entitlements', 'w') as f:
              f.write(ent_cleaned)
          print("=== CraftLink.entitlements ===")
          print(ent_cleaned)
          PYEOF

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project CraftLink.xcodeproj \
            -scheme CraftLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

      - name: Ad-hoc sign binary with entitlements (TrollStore 兼容)
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          echo "App path: $APP_PATH"

          # 规范化 entitlements 文件
          plutil -convert xml1 CraftLink.entitlements
          plutil -lint CraftLink.entitlements

          # 复制 entitlements 到包内
          cp CraftLink.entitlements "$APP_PATH/"

          # CODE_SIGNING_ALLOWED=NO 下二进制无签名段，先 ad-hoc fakesign 再嵌权限
          echo "Step 1: ad-hoc fakesign binary..."
          ldid -S "$APP_PATH/CraftLink"

          echo "Step 2: embed entitlements into signed binary..."
          ldid -S"$APP_PATH/CraftLink.entitlements" "$APP_PATH/CraftLink"

          echo "✅ Entitlements embedded. Verifying..."
          ldid -e "$APP_PATH/CraftLink" || echo "(empty entitlements — expected for non-NE app)"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" | head -n1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CraftLink.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CraftLink-unsigned.ipa
          path: CraftLink.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: CraftLink.ipa
